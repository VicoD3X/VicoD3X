<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Compact backend and AI infrastructure reference architecture</title>
  <desc id="desc">A compact horizontal architecture rail for small screens, connecting sources, a contract gateway, a supervised runtime, bounded state, and API or stream delivery.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D121B"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141D2B"/>
      <stop offset="1" stop-color="#0E141E"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A263A"/>
      <stop offset="1" stop-color="#111925"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52698F"/>
      <stop offset="0.5" stop-color="#91A9DF"/>
      <stop offset="1" stop-color="#5F8192"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02050A" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8EA9E4"/>
    </marker>
    <style>
      text { font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .kicker { fill:#8FA5D5; font-size:14px; font-weight:720; letter-spacing:2.2px; }
      .section { fill:#94A9D5; font-size:13px; font-weight:750; letter-spacing:1.25px; }
      .title { fill:#F1F5FD; font-size:21px; font-weight:650; }
      .body { fill:#A5B2C7; font-size:16px; font-weight:470; }
      .micro { fill:#73819A; font-size:12px; font-weight:650; letter-spacing:.8px; }
      .flow { stroke-dasharray:6 10; animation:flow 14s linear infinite; }
      .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 4.8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset:-160; } }
      @keyframes pulse { 0%,70%,100% { opacity:.58; transform:scale(.84); } 82% { opacity:1; transform:scale(1); } }
      @media (prefers-reduced-motion:reduce) { .flow,.pulse { animation:none; } }
    </style>
  </defs>

  <rect x="6" y="6" width="948" height="348" rx="22" fill="url(#bg)" stroke="#263248"/>
  <text class="kicker" x="30" y="36">REFERENCE ARCHITECTURE / SIGNAL RAIL</text>
  <text class="micro" x="930" y="36" text-anchor="end">COMPACT VIEW</text>
  <line x1="30" y1="55" x2="930" y2="55" stroke="#26344A"/>

  <path d="M20 178H940" stroke="#243149" stroke-width="9" stroke-linecap="round"/>
  <path d="M20 178H940" stroke="url(#rail)" stroke-width="1.5" stroke-linecap="round"/>
  <path class="flow" d="M20 178H940" stroke="#B4C7F2" stroke-width="1.5" opacity="0.32"/>
  <circle cx="20" cy="178" r="14" fill="#0B111B" stroke="#405474"/>
  <circle cx="20" cy="178" r="4" fill="#8EA8DF"/>
  <circle cx="940" cy="178" r="14" fill="#0B111B" stroke="#405474"/>
  <circle cx="940" cy="178" r="4" fill="#8EA8DF"/>

  <g transform="translate(34 108)" filter="url(#shadow)">
    <rect width="142" height="140" rx="15" fill="url(#card)" stroke="#36455F"/>
    <text class="section" x="16" y="25">SOURCES</text>
    <text class="title" x="16" y="55">Inputs</text>
    <text class="body" x="16" y="82">Events</text>
    <text class="body" x="16" y="105">Snapshots</text>
    <text class="body" x="16" y="128">Artifacts</text>
  </g>

  <path d="M176 178H194" stroke="#8EA9E4" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(194 120)" filter="url(#shadow)">
    <rect width="156" height="116" rx="15" fill="url(#card)" stroke="#3C4C67"/>
    <text class="section" x="16" y="25">GATEWAY</text>
    <text class="title" x="16" y="55">Intake</text>
    <text class="body" x="16" y="82">Adapters</text>
    <text class="body" x="16" y="105">Contracts · policy</text>
  </g>

  <path d="M350 178H370" stroke="#8EA9E4" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(370 88)" filter="url(#shadow)">
    <rect width="232" height="180" rx="18" fill="url(#core)" stroke="#7189BD"/>
    <text class="section" x="18" y="28">VPS / DEDICATED</text>
    <text class="title" x="18" y="61">Runtime core</text>
    <text class="body" x="18" y="91">Orchestrator · domain</text>
    <text class="body" x="18" y="119">Workers · AI runtime</text>
    <rect x="18" y="139" width="196" height="25" rx="12.5" fill="#0B121D" stroke="#3A4D6D"/>
    <circle class="pulse" cx="32" cy="151.5" r="4" fill="#8CA8E4"/>
    <text class="micro" x="44" y="156">SUPERVISED</text>
  </g>

  <path d="M602 178H622" stroke="#8EA9E4" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(622 120)" filter="url(#shadow)">
    <rect width="148" height="116" rx="15" fill="url(#card)" stroke="#3C4C67"/>
    <text class="section" x="16" y="25">STATE</text>
    <text class="title" x="16" y="55">Bounded</text>
    <text class="body" x="16" y="82">Buffer · SQLite</text>
    <text class="body" x="16" y="105">Cache · registry</text>
  </g>

  <path d="M770 178H790" stroke="#8EA9E4" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(790 108)" filter="url(#shadow)">
    <rect width="136" height="140" rx="15" fill="url(#card)" stroke="#36455F"/>
    <text class="section" x="16" y="25">DELIVERY</text>
    <text class="title" x="16" y="55">API + SSE</text>
    <text class="body" x="16" y="82">Projection</text>
    <text class="body" x="16" y="105">Desktop</text>
    <text class="body" x="16" y="128">Web</text>
  </g>

  <path d="M486 268V285M696 236V285M858 248V285" stroke="#4A5B76" stroke-width="1" stroke-dasharray="3 6"/>
  <rect x="250" y="285" width="460" height="40" rx="20" fill="#0A1018" stroke="#2D3A50"/>
  <text class="micro" x="270" y="310">CONTROL</text>
  <circle cx="354" cy="305" r="3" fill="#718FCF"/><text class="micro" x="365" y="310">SUPERVISOR</text>
  <circle cx="483" cy="305" r="3" fill="#718FCF"/><text class="micro" x="494" y="310">HEALTH</text>
  <circle cx="569" cy="305" r="3" fill="#718FCF"/><text class="micro" x="580" y="310">RECOVERY</text>
  <text class="micro" x="930" y="338" text-anchor="end">EVENTS · SNAPSHOTS · ARTIFACTS</text>
</svg>
