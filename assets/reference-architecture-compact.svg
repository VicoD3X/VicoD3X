<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Compact backend and AI infrastructure</title>
  <desc id="desc">Sources connect through a gateway to a supervised runtime, bounded state, and API or stream delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#4493F8"/></marker>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      rect,line,path,circle { vector-effect:non-scaling-stroke; }
      .card { fill:#161B22; stroke:#30363D; stroke-width:2; }
      .core { fill:#161B22; stroke:#4493F8; stroke-width:2; }
      .title { fill:#F0F6FC; font-size:20px; font-weight:650; }
      .label { fill:#C9D1D9; font-size:15px; font-weight:500; }
      .meta { fill:#8C959F; font-size:12px; font-weight:650; letter-spacing:.25px; }
      .flow { stroke-dasharray:6 10; animation:flow 13s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-160; } }
      @media (prefers-reduced-motion:reduce) { .flow { animation:none; } }
    </style>
  </defs>

  <rect x="4" y="4" width="952" height="292" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M18 142H942" stroke="#30363D" stroke-width="6" stroke-linecap="round"/>
  <path d="M18 142H942" stroke="#4493F8" stroke-width="2" stroke-linecap="round"/>
  <path class="flow" d="M18 142H942" stroke="#79C0FF" stroke-width="2" opacity=".45"/>

  <g transform="translate(24 79)">
    <rect class="card" width="132" height="126" rx="12"/>
    <circle cx="18" cy="25" r="6" fill="#4493F8"/>
    <text class="title" x="32" y="32">Sources</text>
    <text class="label" x="16" y="62">Events</text>
    <text class="label" x="16" y="87">Snapshots</text>
    <text class="label" x="16" y="112">Artifacts</text>
  </g>
  <path d="M156 142H174" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(174 91)">
    <rect class="card" width="142" height="102" rx="12"/>
    <circle cx="18" cy="25" r="6" fill="#58A6FF"/>
    <text class="title" x="32" y="32">Gateway</text>
    <text class="label" x="16" y="62">Adapters</text>
    <text class="label" x="16" y="87">Contracts</text>
  </g>
  <path d="M316 142H336" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(336 60)">
    <rect class="core" width="230" height="164" rx="14"/>
    <circle cx="20" cy="27" r="7" fill="#3FB950"/>
    <text class="title" x="36" y="34">Runtime</text>
    <rect x="158" y="15" width="55" height="24" rx="12" fill="#1F2937"/>
    <text class="meta" x="185.5" y="31" text-anchor="middle">VPS</text>
    <line x1="16" y1="52" x2="214" y2="52" stroke="#30363D" stroke-width="2"/>
    <rect x="16" y="68" width="94" height="32" rx="7" fill="#21262D"/><text class="label" x="27" y="90">Core</text>
    <rect x="120" y="68" width="94" height="32" rx="7" fill="#21262D"/><text class="label" x="131" y="90">Domain</text>
    <rect x="16" y="110" width="94" height="32" rx="7" fill="#21262D"/><text class="label" x="27" y="132">Workers</text>
    <rect x="120" y="110" width="94" height="32" rx="7" fill="#21262D"/><circle cx="134" cy="126" r="4" fill="#A371F7"/><text class="label" x="145" y="132">AI</text>
    <text class="meta" x="16" y="157">LINUX · DOCKER</text>
  </g>
  <path d="M566 142H586" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(586 91)">
    <rect class="card" width="150" height="102" rx="12"/>
    <circle cx="18" cy="25" r="6" fill="#A371F7"/>
    <text class="title" x="32" y="32">State</text>
    <text class="label" x="16" y="62">Buffer · SQLite</text>
    <text class="label" x="16" y="87">Cache · registry</text>
  </g>
  <path d="M736 142H756" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(756 79)">
    <rect class="card" width="180" height="126" rx="12"/>
    <circle cx="18" cy="25" r="6" fill="#3FB950"/>
    <text class="title" x="32" y="32">Delivery</text>
    <text class="label" x="16" y="62">API · Stream</text>
    <text class="label" x="16" y="87">Desktop</text>
    <text class="label" x="16" y="112">Web</text>
  </g>

  <path d="M451 224V241" stroke="#30363D" stroke-width="2" stroke-dasharray="4 5"/>
  <g transform="translate(280 241)">
    <rect width="400" height="38" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <circle cx="20" cy="19" r="6" fill="#3FB950"/>
    <text class="meta" x="35" y="24">SUPERVISOR</text>
    <text class="meta" x="151" y="24">MODES</text>
    <text class="meta" x="228" y="24">HEALTH</text>
    <text class="meta" x="309" y="24">RECOVERY</text>
  </g>
</svg>
