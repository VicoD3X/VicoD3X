<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Backend and AI infrastructure</title>
  <desc id="desc">A five-stage system rail: sources, gateway, supervised runtime, bounded state, and API or stream delivery. Operational controls sit below the runtime.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L9 5L1 9Z" fill="#4493F8"/>
    </marker>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      rect,line,path,circle,polyline { vector-effect:non-scaling-stroke; }
      .card { fill:#161B22; stroke:#30363D; stroke-width:2; }
      .core { fill:#161B22; stroke:#4493F8; stroke-width:2; }
      .divider { stroke:#30363D; stroke-width:2; }
      .title { fill:#F0F6FC; font-size:27px; font-weight:650; letter-spacing:-.35px; }
      .label { fill:#C9D1D9; font-size:20px; font-weight:500; }
      .pill-label { fill:#C9D1D9; font-size:18px; font-weight:600; }
      .meta { fill:#8C959F; font-size:17px; font-weight:600; letter-spacing:.35px; }
      .rail-base { stroke:#30363D; stroke-width:6; stroke-linecap:round; }
      .rail { stroke:#4493F8; stroke-width:2; stroke-linecap:round; }
      .rail-flow { stroke:#79C0FF; stroke-width:2; stroke-linecap:round; stroke-dasharray:8 12; animation:flow 13s linear infinite; }
      .status { animation:pulse 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes flow { to { stroke-dashoffset:-200; } }
      @keyframes pulse { 0%,72%,100% { opacity:.7; } 84% { opacity:1; } }
      @media (prefers-reduced-motion:reduce) { .rail-flow,.status { animation:none; } }
    </style>
  </defs>

  <rect x="4" y="4" width="1592" height="372" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <!-- Main pipeline -->
  <path class="rail-base" d="M36 162H1564"/>
  <path class="rail" d="M36 162H1564"/>
  <path class="rail-flow" d="M36 162H1564" opacity=".48"/>
  <circle cx="30" cy="162" r="10" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>
  <circle cx="1570" cy="162" r="10" fill="#0D1117" stroke="#4493F8" stroke-width="2"/>

  <path d="M254 162H290" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M516 162H552" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M902 162H938" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1194 162H1230" stroke="#4493F8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sources -->
  <g id="sources" aria-label="Sources" transform="translate(44 60)">
    <title>Sources: ordered events, snapshots, and artifacts</title>
    <rect class="card" width="210" height="204" rx="14"/>
    <g transform="translate(20 20)" stroke="#8C959F" stroke-width="2" fill="none">
      <circle cx="7" cy="8" r="5"/><circle cx="7" cy="38" r="5"/><circle cx="30" cy="23" r="5"/>
      <path d="M12 8H20C26 8 30 14 30 18M12 38H20C26 38 30 32 30 28"/>
    </g>
    <text class="title" x="68" y="49">Sources</text>
    <line class="divider" x1="18" y1="70" x2="192" y2="70"/>
    <circle cx="26" cy="101" r="5" fill="#4493F8"/>
    <text class="label" x="44" y="108">Events</text>
    <circle cx="26" cy="137" r="5" fill="#58A6FF" opacity=".7"/>
    <text class="label" x="44" y="144">Snapshots</text>
    <circle cx="26" cy="173" r="5" fill="#A371F7"/>
    <text class="label" x="44" y="180">Artifacts</text>
  </g>

  <!-- Gateway -->
  <g id="gateway" aria-label="Gateway" transform="translate(290 78)">
    <title>Gateway: adapters, contracts, and policy</title>
    <rect class="card" width="226" height="168" rx="14"/>
    <g transform="translate(20 18)" fill="none" stroke="#8C959F" stroke-width="2">
      <path d="M4 8H30M22 0L30 8L22 16M30 30H4M12 22L4 30L12 38"/>
    </g>
    <text class="title" x="68" y="46">Gateway</text>
    <line class="divider" x1="18" y1="65" x2="208" y2="65"/>
    <text class="label" x="22" y="98">Adapters</text>
    <text class="label" x="22" y="129">Contracts · Policy</text>
  </g>

  <!-- Runtime -->
  <g id="runtime" aria-label="Runtime core" transform="translate(552 42)">
    <title>Runtime core on a VPS or dedicated host: orchestrator, domain services, workers, and AI runtime</title>
    <rect class="core" width="350" height="240" rx="16"/>
    <g transform="translate(20 19)" fill="none" stroke="#58A6FF" stroke-width="2">
      <rect x="0" y="0" width="34" height="30" rx="5"/>
      <line x1="8" y1="10" x2="26" y2="10"/><line x1="8" y1="20" x2="20" y2="20"/>
      <circle cx="27" cy="20" r="2" fill="#3FB950" stroke="none"/>
    </g>
    <text class="title" x="68" y="48">Runtime</text>
    <rect x="246" y="19" width="84" height="30" rx="15" fill="#1F2937" stroke="#30363D" stroke-width="2"/>
    <circle class="status" cx="263" cy="34" r="5" fill="#3FB950"/>
    <text class="meta" x="276" y="40">VPS</text>
    <line class="divider" x1="18" y1="68" x2="332" y2="68"/>

    <rect x="18" y="88" width="150" height="48" rx="9" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="34" y="119">Orchestrator</text>
    <rect x="182" y="88" width="150" height="48" rx="9" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="198" y="119">Domain</text>
    <rect x="18" y="150" width="150" height="48" rx="9" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="34" y="181">Workers</text>
    <rect x="182" y="150" width="150" height="48" rx="9" fill="#21262D" stroke="#30363D" stroke-width="2"/>
    <circle cx="201" cy="174" r="5" fill="#A371F7"/>
    <text class="pill-label" x="216" y="181">AI runtime</text>
    <text class="meta" x="18" y="225">LINUX · DOCKER · DEDICATED</text>
  </g>

  <!-- State -->
  <g id="state" aria-label="State" transform="translate(938 78)">
    <title>State: sequenced buffer, SQLite snapshots, bounded cache, and artifact registry</title>
    <rect class="card" width="256" height="168" rx="14"/>
    <g transform="translate(20 17)" fill="none" stroke="#8C959F" stroke-width="2">
      <ellipse cx="18" cy="7" rx="17" ry="6"/><path d="M1 7V33C1 37 9 40 18 40S35 37 35 33V7"/>
      <path d="M1 20C1 24 9 27 18 27S35 24 35 20"/>
    </g>
    <text class="title" x="68" y="46">State</text>
    <line class="divider" x1="18" y1="65" x2="238" y2="65"/>
    <rect x="18" y="83" width="102" height="29" rx="7" fill="#21262D"/>
    <text class="pill-label" x="31" y="104">Buffer</text>
    <rect x="134" y="83" width="104" height="29" rx="7" fill="#21262D"/>
    <text class="pill-label" x="147" y="104">SQLite</text>
    <rect x="18" y="124" width="102" height="29" rx="7" fill="#21262D"/>
    <text class="pill-label" x="31" y="145">Cache</text>
    <rect x="134" y="124" width="104" height="29" rx="7" fill="#21262D"/>
    <text class="pill-label" x="147" y="145">Registry</text>
  </g>

  <!-- Delivery -->
  <g id="delivery" aria-label="Delivery" transform="translate(1230 60)">
    <title>Delivery: typed API, live stream, and desktop or web clients</title>
    <rect class="card" width="326" height="204" rx="14"/>
    <g transform="translate(20 18)" fill="none" stroke="#8C959F" stroke-width="2">
      <rect x="0" y="0" width="38" height="32" rx="5"/>
      <path d="M8 10L14 16L8 22M19 22H29"/>
    </g>
    <text class="title" x="76" y="49">Delivery</text>
    <line class="divider" x1="18" y1="70" x2="308" y2="70"/>
    <circle cx="26" cy="102" r="5" fill="#4493F8"/>
    <text class="label" x="44" y="109">Typed API</text>
    <circle cx="26" cy="138" r="5" fill="#3FB950"/>
    <text class="label" x="44" y="145">Live stream</text>
    <circle cx="26" cy="174" r="5" fill="#8C959F"/>
    <text class="label" x="44" y="181">Desktop · Web</text>
  </g>

  <!-- Operational controls -->
  <path d="M727 282V304" stroke="#30363D" stroke-width="2" stroke-dasharray="4 5"/>
  <g id="operations" aria-label="Operational controls" transform="translate(493 304)">
    <title>Operational controls: supervisor, runtime modes, health, and recovery</title>
    <rect width="614" height="48" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <circle cx="24" cy="24" r="7" fill="#3FB950"/>
    <path d="M20 24L23 27L29 20" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="pill-label" x="44" y="31">Supervisor</text>
    <line x1="160" y1="12" x2="160" y2="36" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="182" y="31">Modes</text>
    <line x1="274" y1="12" x2="274" y2="36" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="296" y="31">Health</text>
    <line x1="389" y1="12" x2="389" y2="36" stroke="#30363D" stroke-width="2"/>
    <text class="pill-label" x="411" y="31">Recovery</text>
    <rect x="516" y="12" width="78" height="24" rx="12" fill="#12261A" stroke="#238636" stroke-width="2"/>
    <text x="555" y="29" text-anchor="middle" fill="#56D364" font-size="15" font-weight="650">READY</text>
  </g>
</svg>
